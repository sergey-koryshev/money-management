name: Increment version for 'Frontend'

concurrency: versioning

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - epic/**
      - release/**
    paths:
      - source/frontend/**
  workflow_run:
    workflows: [Propagate Product Version]
    types:
      - completed
    branches:
      - release/**

jobs:
  create_label:
    name: Increment version
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    env:
      ROOT_PATH: source/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Get suffix
        id: suffix
        if: ${{ startsWith(github.ref, 'refs/heads/epic/') || startsWith(github.ref, 'refs/heads/release/') }}
        shell: pwsh
        run: |
          $branchName = "${{ github.ref_name }}"
          $suffix = [string]::Empty

          if ($branchName.StartsWith("release/") {
            $suffix = "-rc"
          } else {
            $suffix = $branchName -replace "^epic/", "-"
          }
          "suffix=$suffix" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Increment Version
        uses: sergey-koryshev/bump-version@v1.2.2
        with:
          app-name: frontend
          root-path: ${{ env.ROOT_PATH }}
          project-type: Node
          version-configuration-path: ${{ env.ROOT_PATH }}/${{ case(github.ref == 'refs/heads/master', 'version-configuration.json', 'epic-version-configuration.json') }}
          default-increment-part: ${{ case(github.ref == 'refs/heads/master', 'Patch', 'Suffix') }}
          suffix: ${{ steps.suffix.outputs.suffix }}
